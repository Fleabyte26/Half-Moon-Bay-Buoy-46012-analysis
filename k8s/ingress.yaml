apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wavecast-ai-ingress
  annotations:
    # Use Google-managed SSL certificates
    networking.gke.io/managed-certificates: "wavecast-ai-cert"
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - host: wavecast.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wavecast-ai-service
            port:
              number: 80